[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src
timeout = 30
timeout_method = thread
addopts = -ra --strict-markers
markers =
    smoke: P0 gate. DNS, TCP, TLS, HTTP, and the latency SLA.
    connectivity: TCP reachability checks
    dns: name resolution checks
    http: HTTP and TLS checks
    perf: latency, timeout, and retry checks
    negative: fail-closed and edge-behavior checks
    transient: one extra attempt is allowed on timeout
    net_c01: NET-C01 TCP reachability
    net_c02: NET-C02 critical port
    net_c03: NET-C03 unreachable host timeout
    net_c04: NET-C04 wrong port
    net_d01: NET-D01 resolve FQDN
    net_d02: NET-D02 NXDOMAIN
    net_d03: NET-D03 multiple addresses
    net_d04: NET-D04 bad resolver timeout
    net_h01: NET-H01 health GET
    net_h02: NET-H02 TLS handshake
    net_h03: NET-H03 redirect
    net_h04: NET-H04 response headers
    net_h05: NET-H05 4xx status
    net_p01: NET-P01 latency SLA
    net_p02: NET-P02 soft timeout
    net_p03: NET-P03 limited retries
    net_n01: NET-N01 HTTP to HTTPS
    net_n02: NET-N02 bad certificate fails closed
    net_n03: NET-N03 slow response timeout
    net_n04: NET-N04 SNI mismatch fails closed
