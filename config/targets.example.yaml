# Optional YAML fallback when TARGET_URL is unset.
# Prefer: TARGET_URL=https://your-site.com/ pytest -m smoke
# One `site` profile — same shape the dynamic builder produces from a URL.

site:
  description: Public lab site (example.com)
  hosts:
    - example.com
  ports: [443]
  criticalPort: 443
  latencyMs: 3000
  timeoutSec: 5
  http:
    baseUrl: https://example.com
    healthPath: /
    expectedStatus: [200]
    notFoundPath: /net-h05-missing-path
    redirectUrl: http://one.one.one.one/
    expectedHeaders: [content-type]
  dns:
    multiAHost: one.one.one.one
    minAddresses: 2
  overlays: []
